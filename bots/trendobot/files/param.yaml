strategy-parameters:
  trade-per-day: 3
  max-open-trades: 1

  # PERCENT values as fractions
  take-profit: 0.5     # +50%
  stop-loss: 0.113       # -10%

  max_daily_loss_pct_of_initial_cash: 0.03  # Stop new trades for the day after 2% realized loss

  # on high volatile days, increase min_atr_14 and option_atr_period
  min_atr_14: 7
  option_atr_period: 5

  adx_threshold: 21

  trailing-stop: true
  break-even-point: 3

  sl-limit-gap: 1.0

  itm_strike_range: 400

  trade_expiry: "2026-05-12"
  pcr_expiry: "2026-05-12"
  pcr_poll_interval_sec: 120

  max_atr_for_contract: 20
  min_atr_for_contract: 13

  trade_within_day_open_limits: False
  ltp_open_max_distance_points: 210

  vwap_source: "hlc3"
  vwap_bands_calc_mode: "Standard Deviation"
  vwap_band_mult_1: 1.0
  vwap_band_mult_2: 2.0
  vwap_band_mult_3: 3.0

  up_angle_ema: 40
  
  dn_angle_ema: -40

  lot-size:
    small: 6
    medium: 8
    large: 10

  trade-window:
    start: "09:45"
    end: "15:00"

historical-trends: &historical_trends
  weekly: "super_bearish"
  daily: "bullish"
  trader-sentiment: "bullish"

# Backward-compatible alias
historical-trend: *historical_trends
