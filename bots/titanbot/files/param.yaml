strategy-parameters:
  trade-per-day: 2
  max-open-trades: 1

  # PERCENT values as fractions
  take-profit: 0.5     # +50%
  stop-loss: 0.113       # -10%

  max_daily_loss_pct_of_initial_cash: 0.03

  # on high volatile days, increase option_atr_period
  option_atr_period: 5
  use_option_atr_risk: true
  require_option_atr: false
  atr_target_mult: 10
  atr_sl_mult: 3

  trailing-stop: true
  trailing-stop-distance: 10  # SL trails by 10 points once trailing starts
  trail-start-after-points: 0.1 # start trailing only after +5 points move
  trailing-factor: 1.5

  break-even-point: 3

  sl-limit-gap: 1.0

  itm_strike_range: 400

  trade_expiry: "2026-06-30"
  pcr_expiry: "2026-06-30"
  pcr_poll_interval_sec: 120

  max_atr_for_contract: 20
  min_atr_for_contract: 13

  trade_within_day_open_limits: False
  ltp_open_max_distance_points: 210

  timeseries_ema_length: 9
  slope_window: 3
  call_ema_angle_10m_threshold: 20
  call_ema_angle_5m_threshold: 30
  call_ema_angle_1m_threshold: 45
  put_ema_angle_10m_threshold: -20
  put_ema_angle_5m_threshold: -30
  put_ema_angle_1m_threshold: -45

  lot-size:
    small: 1
    medium: 1
    large: 1

  trade-window:
    start: "10:00"
    end: "15:00"

historical-trends: &historical_trends
  weekly: "super_bearish"
  daily: "bullish"
  trader-sentiment: "bullish"

# Backward-compatible alias
historical-trend: *historical_trends
